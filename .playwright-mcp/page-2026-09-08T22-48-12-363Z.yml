    - generic [ref=f2e214]:
      - generic [ref=f2e215]:
        - generic [ref=f2e216]: How to
        - heading "網路購票教學" [level=2] [ref=f2e217]
      - generic [ref=f2e218]:
        - article [ref=f2e219]:
          - generic [ref=f2e220]: "01"
          - heading "先用官方時刻表找直達班次" [level=3] [ref=f2e221]
          - paragraph [ref=f2e222]: 在 Passenger Portal 輸入出發站、抵達站、日期與目標時間，勾選 Direct connections。四段起點依序使用 Warszawa Zachodnia、Kraków Główny、Wrocław Główny、Poznań Główny。
        - article [ref=f2e223]:
          - generic [ref=f2e224]: "02"
          - heading "進 PKP Intercity 官方購票頁重查" [level=3] [ref=f2e225]
          - paragraph [ref=f2e226]: 用相同站名與日期搜尋；通常最早約 30 天前開放，10/25、27、28、29 的提醒日分別是 9/25、9/27、9/28、9/29，但不是保證開賣日。只有購票頁顯示可選車次與價格時才算可售。
        - article [ref=f2e227]:
          - generic [ref=f2e228]: "03"
          - heading "選車種、艙等與正確優惠資格" [level=3] [ref=f2e229]
          - paragraph [ref=f2e230]: 優先選直達 EIP／EIC／IC／TLK，依實際抵達時間與預算決定。沒有符合波蘭法定優惠資格就選一般成人票，不自行套用學生或年齡折扣。
        - article [ref=f2e231]:
          - generic [ref=f2e232]: "04"
          - heading "確認座位與旅客資料再付款" [level=3] [ref=f2e233]
          - paragraph [ref=f2e234]: 依系統畫面選 2 等座、座位偏好與同行人數；付款前核對日期、起訖站、車次、發到時間、車廂與座位。
        - article [ref=f2e235]:
          - generic [ref=f2e236]: "05"
          - heading "下載 PDF 並保存離線副本" [level=3] [ref=f2e237]
          - paragraph [ref=f2e238]: 付款成功後立即下載票券 PDF，另存到手機離線資料夾；每一段都記錄車次、車廂、座位與取消／改票條件。
        - article [ref=f2e239]:
          - generic [ref=f2e240]: "06"
          - heading "搭車前再查月台與異動" [level=3] [ref=f2e241]
          - paragraph [ref=f2e242]: 前一晚與到站後用 Passenger Portal 查看延誤或改道，進站仍以電子看板為準；至少提早 20–30 分鐘抵達大站。
